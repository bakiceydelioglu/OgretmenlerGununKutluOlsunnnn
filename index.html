<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a1e">
<meta name="color-scheme" content="dark">
<title>Öğretmenler Günün Kutlu Olsun!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b2a1e; --sapphire:#1f6b4a; --ocean:#2fa36b; --sky:#7fd68a;
  --ice:#effbe9; --cyan:#ffe27a; --silver:#f8fff3; --champagne:#ffe9a8;
  --glass:rgba(200,240,200,.09); --glass-line:rgba(210,245,200,.28);
  --serif:"Fraunces",Georgia,serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:dark}
body{margin:0;background:var(--night);color:var(--ice);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden;min-height:100svh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}

/* Aurora arka plan */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(130% 95% at 50% 108%,#4cbf7a 0%,#1f7a52 34%,#0f4631 70%,#0b2a1e 100%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
.aurora i:nth-child(1){width:70vmax;height:46vmax;left:-20vmax;top:-10vmax;background:radial-gradient(closest-side,var(--ocean),transparent);animation:drift1 22s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:60vmax;height:40vmax;right:-25vmax;top:18vh;background:radial-gradient(closest-side,rgba(255,226,122,.75),transparent);animation:drift2 28s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:80vmax;height:40vmax;left:5vmax;bottom:-22vmax;background:radial-gradient(closest-side,#e86aa6,transparent);animation:drift3 25s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-20vmax,-6vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(14vmax,-9vmax) scale(1.2)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

main{position:relative;z-index:2}
section{padding:clamp(56px,10vh,120px) max(22px,env(safe-area-inset-right)) clamp(56px,10vh,120px) max(22px,env(safe-area-inset-left))}

/* Hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:max(40px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom))}
.hero .date{font-size:.95rem;letter-spacing:.32em;color:var(--champagne);margin:0 0 1.4rem}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,10vw,6rem);line-height:1.02;margin:0;color:var(--silver);text-shadow:0 0 40px rgba(140,220,130,.55)}
.hero h1 span{display:block}
.hero p.sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,3.6vw,1.8rem);max-width:30ch;margin:1.6rem auto 3rem;color:var(--ice)}
.intro .line{opacity:0;transform:translateY(18px);filter:blur(6px);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.intro .l1{animation-delay:.3s}.intro .l2{animation-delay:.9s}.intro .l3{animation-delay:1.6s}.intro .l4{animation-delay:2.3s}
@keyframes rise{to{opacity:1;transform:none;filter:none}}

.cta{position:relative;border:1px solid var(--glass-line);background:linear-gradient(135deg,rgba(140,220,130,.28),rgba(255,226,122,.16));
  padding:1.05rem 2.4rem;border-radius:999px;font-weight:500;letter-spacing:.06em;font-size:1.02rem;color:var(--silver);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .35s,box-shadow .35s,background .35s}
.cta::before,.cta::after{content:"";position:absolute;inset:-2px;border-radius:inherit;border:1px solid rgba(255,226,122,.6);animation:pulse 2.8s ease-out infinite;pointer-events:none}
.cta::after{animation-delay:1.4s}
@keyframes pulse{from{transform:scale(1);opacity:.85}to{transform:scale(1.55,1.9);opacity:0}}
.cta:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 0 44px rgba(255,226,122,.5),inset 0 0 22px rgba(239,251,233,.2)}
.cta:active{transform:scale(.97)}
.hint{margin-top:1.2rem;font-size:.82rem;color:rgba(239,251,233,.55)}

/* Gizli bölümler */
#content{display:none}
#content.on{display:block}
#content.on > section{animation:fadein 1.2s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

h2{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,6vw,3.2rem);text-align:center;margin:0 0 .6rem;color:var(--silver)}
.lead{text-align:center;max-width:44ch;margin:0 auto 2.8rem;color:rgba(239,251,233,.75)}

/* Kartlar */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1040px;margin:0 auto}
.card{height:290px;cursor:pointer;outline-offset:6px;border-radius:26px;-webkit-user-select:none;user-select:none}
.inner{position:relative;width:100%;height:100%}
.face{position:absolute;inset:0;border-radius:26px;padding:26px;
  background:linear-gradient(160deg,rgba(18,70,48,.92),rgba(10,44,32,.94));border:1px solid var(--glass-line);
  box-shadow:0 18px 50px rgba(2,24,14,.5),inset 0 1px 0 rgba(255,255,255,.2);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  transition:transform .45s ease,opacity .45s ease}
.face.front{transform:perspective(900px) rotateY(0deg);opacity:1}
.face.back{transform:perspective(900px) rotateY(-90deg);opacity:0;pointer-events:none;background:linear-gradient(160deg,rgba(214,88,140,.95),rgba(52,150,100,.92))}
.card:not(.flipped) .face.front{transition-delay:.4s}
.card.flipped .face.front{transform:perspective(900px) rotateY(90deg);opacity:0}
.card.flipped .face.back{transform:perspective(900px) rotateY(0deg);opacity:1;transition-delay:.4s}
.face.front svg{width:54px;height:54px;margin-bottom:16px;filter:drop-shadow(0 0 14px rgba(255,226,122,.7))}
.face.front h3{font-family:var(--serif);font-weight:500;font-size:1.7rem;margin:0;color:var(--silver)}
.face.front small{margin-top:14px;color:rgba(239,251,233,.55);font-size:.78rem}
.face.back p{font-family:var(--serif);font-size:1.22rem;line-height:1.55;margin:0;color:var(--silver)}

/* Bahçe */
.garden{text-align:center}
.garden p{font-family:var(--serif);font-style:italic;font-size:clamp(1.3rem,4vw,2rem);color:var(--ice);margin:0 auto;max-width:28ch}
.garden .tip{display:block;margin-top:1rem;font-family:var(--sans);font-style:normal;font-size:.85rem;color:rgba(239,251,233,.55)}

/* Mektup */
.paper{max-width:640px;margin:0 auto;padding:clamp(26px,6vw,56px);border-radius:30px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(2,24,14,.55),inset 0 1px 0 rgba(255,255,255,.22)}
.paper h2{text-align:left;font-size:clamp(1.7rem,5vw,2.3rem)}
#typed{font-family:var(--serif);font-size:clamp(1.2rem,3.6vw,1.45rem);line-height:1.65;white-space:pre-wrap;min-height:10em;color:var(--silver)}
#typed::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:3px;vertical-align:-.15em;background:var(--cyan);animation:blink 1s steps(1) infinite}
#typed.done::after{display:none}
@keyframes blink{50%{opacity:0}}
.sign{margin-top:1.6rem;text-align:right;font-family:var(--serif);font-style:italic;font-size:1.6rem;color:var(--champagne);opacity:0;transition:opacity 2s}
.sign.on{opacity:1}
footer{text-align:center;padding:30px 20px calc(40px + env(safe-area-inset-bottom));font-size:.78rem;color:rgba(239,251,233,.4)}

/* Yüzen kontroller */
.float{position:fixed;z-index:20;border:1px solid var(--glass-line);background:rgba(12,50,36,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--silver);border-radius:999px;transition:transform .3s,opacity .6s,box-shadow .3s}
.float:hover{transform:scale(1.07);box-shadow:0 0 28px rgba(255,226,122,.4)}
#sound{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));width:46px;height:46px;display:grid;place-items:center}
#sound svg{width:22px;height:22px}
#again{bottom:calc(18px + env(safe-area-inset-bottom));right:calc(16px + env(safe-area-inset-right));padding:.8rem 1.3rem;opacity:0;pointer-events:none;font-weight:500}
#again.on{opacity:1;pointer-events:auto}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<button class="float" id="sound" type="button" aria-label="Müziği aç" aria-pressed="false"></button>
<button class="float" id="again" type="button">Tekrar Kutla ✨</button>

<main>
  <section class="hero intro" id="hero">
    <p class="date line l1" id="date">24 Kasım</p>
    <h1><span class="line l2" id="t1"></span><span class="line l3" id="t2"></span></h1>
    <p class="sub line l3" id="sub"></p>
    <div class="line l4">
      <button class="cta" id="start" type="button"></button>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <div id="content">
    <section id="notes">
      <h2 id="notesTitle"></h2>
      <p class="lead" id="notesLead"></p>
      <div class="cards" id="cards"></div>
    </section>

    <section class="garden" id="garden">
      <p id="gardenText"></p>
      <span class="tip" id="gardenTip"></span>
    </section>

    <section id="letterSec">
      <div class="paper">
        <h2 id="letterTitle"></h2>
        <div id="typed" aria-live="polite"></div>
        <div class="sign" id="sign"></div>
      </div>
    </section>
    <footer id="foot"></footer>
  </div>
</main>

<script>
/* ============================================================
   KOLAY ÖZELLEŞTİRME — Sadece bu bölümü düzenlemeniz yeterli.
   ============================================================ */
const CONFIG = {
  senderName: "Baki",               // Senin adın (imza)
  recipientName: "",                // Onun adı: örn. "Deniz". Boş bırakırsan kullanılmaz.
  dateText: "24 Kasım",
  titleLine1: "24 Kasım",
  titleLine2: "Öğretmenler Günün Kutlu Olsun!",
  subtitle: "Sınıftaki herkes ne kadar şanslı olduğunu bilmiyor ama ben biliyorum.",
  buttonText: "Hadi Başla",
  buttonHint: "Bugün sahne senin.",
  notesTitle: "Senin İçin Notlar",
  notesLead: "Her karta dokun, arkasında sana yazdıklarım var.",
  cards: [
    { title: "Sınıfın Yıldızı",
      back: "Sen içeri girince ortam bir anda şenleniyor. O sınıftakiler seni dinlemeye bayılıyordur." },
    { title: "Sonsuz Sabır",
      back: "Aynı şeyi yirmi kere anlatıp hâlâ gülümseyebiliyorsun. Bu resmen süper güç." },
    { title: "Kırmızı Kalemin Sırrı",
      back: "Hem adil hem eğlenceli olmayı başarıyorsun. Bu kombinasyon çok az insanda var." },
    { title: "Küçük Bir Dilek",
      back: "Bütün günlerin senin gibi olsun: neşeli, rengarenk, çayın da hep sıcak!" }
  ],
  gardenText: "Dokunduğun her yerde bir çiçek açar, bir ışık yükselir.",
  gardenTip: "Ekrana dokun, kendi çiçek bahçeni oluştur...",
  letterTitle: "Sana Küçük Bir Mektup",
  letter:
"{name}Bugün senin günün, o yüzden kural basit: sadece alkışlıyoruz!\n\n" +
"Kaç hayata dokunduğunu bir bilsen... Bazen bir gülümsemeyle, bazen kahkahanla, bazen de sadece orada olarak.\n\n" +
"Hep böyle çiçek gibi açmaya devam et. \n\n" +
"Öğretmenler Günün kutlu olsun!",
  footerText: "Çiçek tonlarında küçük bir sürpriz."
};
/* ============================================================ */

(function(){
"use strict";
const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isSmall = Math.min(innerWidth, innerHeight) < 520;
let celebrated = false;

/* ---------- Metinleri yerleştir ---------- */
function applyConfig(){
  const name = CONFIG.recipientName ? CONFIG.recipientName + ",\n\n" : "";
  $("date").textContent = CONFIG.dateText;
  $("t1").textContent = CONFIG.titleLine2.split(" ").slice(0,2).join(" ");
  $("t2").textContent = CONFIG.titleLine2.split(" ").slice(2).join(" ");
  $("sub").textContent = CONFIG.subtitle;
  $("start").textContent = CONFIG.buttonText;
  $("hint").textContent = CONFIG.buttonHint;
  $("notesTitle").textContent = CONFIG.notesTitle;
  $("notesLead").textContent = CONFIG.notesLead;
  $("gardenText").textContent = CONFIG.gardenText;
  $("gardenTip").textContent = CONFIG.gardenTip;
  $("letterTitle").textContent = CONFIG.letterTitle;
  $("sign").textContent = "Sevgiyle, " + CONFIG.senderName;
  $("foot").textContent = CONFIG.footerText;
  document.title = CONFIG.titleLine2.replace(/\.+$/,"");
  window.__letter = CONFIG.letter.replace("{name}", name);

  const flower = '<svg viewBox="0 0 64 64" fill="none" stroke="#fff2c9" stroke-width="1.6"><g transform="translate(32 32)">' +
    [0,60,120,180,240,300].map(a=>'<ellipse rx="6" ry="14" cy="-14" transform="rotate('+a+')" fill="rgba(140,220,130,.25)"/>').join("") +
    '<circle r="5" fill="#ffe9a8" stroke="none"/></g></svg>';
  const wrap = $("cards");
  CONFIG.cards.forEach((c,i)=>{
    const b = document.createElement("div");
    b.className="card"; b.setAttribute("role","button"); b.tabIndex=0; b.setAttribute("aria-pressed","false");
    b.innerHTML = '<div class="inner"><div class="face front">'+flower+'<h3></h3><small>Çevirmek için dokun</small></div><div class="face back"><p></p></div></div>';
    b.querySelector("h3").textContent = c.title;
    b.querySelector(".back p").textContent = c.back;
    const flip=()=>{
      const on = b.classList.toggle("flipped");
      b.setAttribute("aria-pressed", on);
      chime(i);
    };
    b.addEventListener("click",flip);
    b.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip();}});
    wrap.appendChild(b);
  });
}

/* ---------- Canvas motoru ---------- */
const cv = $("fx"), ctx = cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize); resize();

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const COLORS=["#ffffff","#effbe9","#ffb3cf","#7fd68a","#ffe27a","#ff7eb6","#ffe9a8"];

const confetti=[], blooms=[], wishes=[], ambient=[];
let wind=0, windT=0;

for(let i=0;i<(isSmall?22:40);i++) ambient.push({x:rand(0,innerWidth),y:rand(0,innerHeight),r:rand(.8,2.6),vy:rand(.08,.4),ph:rand(0,6.28),a:rand(.25,.8)});

function spawnConfetti(n, mode){
  for(let i=0;i<n;i++){
    let x,y,vx,vy;
    if(mode==="side"){ const left=Math.random()<.5; x=left?-10:W+10; y=rand(H*.1,H*.6); vx=(left?1:-1)*rand(4,11); vy=rand(-10,-2); }
    else { x=rand(0,W); y=rand(-60,-10); vx=rand(-1,1); vy=rand(1,3.5); }
    const tp=pick(["leaf","leaf","daisy","star","rect","rect"]);
    confetti.push({x,y,vx,vy,rot:rand(0,6.28),vr:rand(-.12,.12),size:rand(7,16),
      type:tp,color:tp==="leaf"?pick(["#7fd68a","#4cbf7a","#a8e063","#c9f2a8"]):pick(COLORS),
      phase:rand(0,6.28),sway:rand(.4,1.4),flip:rand(0,6.28)});
  }
}
function drawLeaf(s){ctx.beginPath();ctx.moveTo(0,-s);ctx.quadraticCurveTo(s*.8,-s*.2,0,s);ctx.quadraticCurveTo(-s*.8,-s*.2,0,-s);ctx.fill();}
function drawDaisy(s,c){
  ctx.fillStyle="rgba(255,255,255,.92)";
  for(let k=0;k<8;k++){ctx.save();ctx.rotate(k*Math.PI/4);ctx.beginPath();ctx.ellipse(0,-s*.6,s*.22,s*.5,0,0,6.283);ctx.fill();ctx.restore();}
  ctx.fillStyle="#ffe9a8";ctx.beginPath();ctx.arc(0,0,s*.22,0,6.283);ctx.fill();
}
function drawStar(s){
  ctx.beginPath();
  for(let k=0;k<8;k++){const r=k%2?s*.25:s;const a=k*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
  ctx.closePath();ctx.fill();
}
function drawBloom(b,t){
  const grow=Math.min(1,t/.9), ease=1-Math.pow(1-grow,3), s=b.size*ease;
  const fade=t>b.life-1.2?Math.max(0,(b.life-t)/1.2):1;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot+t*.15);ctx.globalAlpha=fade;
  ctx.shadowColor=b.color;ctx.shadowBlur=18;
  for(let k=0;k<b.petals;k++){
    ctx.save();ctx.rotate(k*6.283/b.petals);
    const g=ctx.createLinearGradient(0,0,0,-s);g.addColorStop(0,"rgba(255,255,255,.95)");g.addColorStop(1,b.color);
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,-s*.55,s*.2,s*.5,0,0,6.283);ctx.fill();ctx.restore();
  }
  ctx.shadowBlur=0;ctx.fillStyle="#ffe9a8";ctx.beginPath();ctx.arc(0,0,s*.18,0,6.283);ctx.fill();
  ctx.restore();
}
function addBloom(x,y){
  if(Math.random()<.35){ wishes.push({x,y,vy:rand(1.2,2.2),ph:rand(0,6.28),t:0,life:rand(3.2,4.5),trail:[]}); }
  else { blooms.push({x,y,t:0,life:rand(4,6),size:rand(22,44),petals:pick([5,6,8]),rot:rand(0,6.28),color:pick(["#7fd68a","#ffe27a","#ffb3cf","#ff7eb6","#fff2c9"])}); }
  if(blooms.length>60) blooms.shift();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  ctx.clearRect(0,0,W,H);
  windT+=dt; wind=Math.sin(windT*.6)*.35;

  // ambient ışık tozları
  ctx.shadowBlur=0;
  for(const p of ambient){
    p.y-=p.vy; p.ph+=dt; p.x+=Math.sin(p.ph)*.25;
    if(p.y<-5){p.y=H+5;p.x=rand(0,W);}
    ctx.globalAlpha=p.a*(.6+.4*Math.sin(p.ph*2));
    ctx.fillStyle="#fff2c9";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;

  // konfeti
  for(let i=confetti.length-1;i>=0;i--){
    const p=confetti[i];
    p.vy+=9*dt*.9; p.vy=Math.min(p.vy,3.2+p.size*.08);
    p.vx*=.985; p.vx+=wind*.08;
    p.phase+=dt*2*p.sway; p.flip+=dt*3;
    p.x+=p.vx+Math.sin(p.phase)*.9; p.y+=p.vy; p.rot+=p.vr;
    if(p.y>H+30||p.x<-80||p.x>W+80){confetti.splice(i,1);continue;}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
    ctx.fillStyle=p.color;
    if(p.type==="leaf"){ctx.scale(1,Math.abs(Math.cos(p.flip))*.8+.2);drawLeaf(p.size*.7);}
    else if(p.type==="daisy"){drawDaisy(p.size*.9);}
    else if(p.type==="star"){ctx.shadowColor=p.color;ctx.shadowBlur=10;drawStar(p.size*.6);}
    else {ctx.scale(Math.cos(p.flip),1);ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}
    ctx.restore();
  }

  // çiçekler
  for(let i=blooms.length-1;i>=0;i--){const b=blooms[i];b.t+=dt;if(b.t>b.life){blooms.splice(i,1);continue;}drawBloom(b,b.t);}

  // dilek ışıkları
  for(let i=wishes.length-1;i>=0;i--){
    const w=wishes[i];w.t+=dt;w.ph+=dt*3;w.y-=w.vy;w.x+=Math.sin(w.ph)*.6;
    w.trail.push({x:w.x,y:w.y});if(w.trail.length>22)w.trail.shift();
    const a=Math.max(0,1-w.t/w.life);
    if(a<=0||w.y<-20){wishes.splice(i,1);continue;}
    w.trail.forEach((t,k)=>{ctx.globalAlpha=a*k/w.trail.length*.5;ctx.fillStyle="#ffb3cf";ctx.beginPath();ctx.arc(t.x,t.y,1+k*.12,0,6.283);ctx.fill();});
    ctx.globalAlpha=a;ctx.shadowColor="#ffe27a";ctx.shadowBlur=22;ctx.fillStyle="#fff";
    ctx.save();ctx.translate(w.x,w.y);drawStar(7);ctx.restore();ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- Kutlama ---------- */
let waveTimer=null;
function celebrate(){
  const base = reduced ? 12 : (isSmall ? 18 : 30);
  let waves=0;
  clearInterval(waveTimer);
  spawnConfetti(base*2,"side");
  waveTimer=setInterval(()=>{
    spawnConfetti(base,"top");
    if(waves%2===0) spawnConfetti(Math.round(base/2),"side");
    if(++waves>=9) clearInterval(waveTimer);
  },320);
  fanfare();
}

$("start").addEventListener("click",()=>{
  startAudioIfWanted(true);
  celebrate();
  if(!celebrated){
    celebrated=true;
    $("content").classList.add("on");
    $("again").classList.add("on");
    setTimeout(()=>$("notes").scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"}),1800);
    observeLetter();
  }
});
$("again").addEventListener("click",()=>{celebrate();});

/* Ekrana dokununca çiçek / dilek ışığı */
document.addEventListener("pointerdown",e=>{
  if(!celebrated) return;
  if(e.target.closest("button,.card")) return;
  addBloom(e.clientX,e.clientY);
});

/* ---------- Daktilo efekti ---------- */
let typingStarted=false;
function observeLetter(){
  const target=$("typed");
  const io=new IntersectionObserver(es=>{
    if(es[0].isIntersecting&&!typingStarted){typingStarted=true;io.disconnect();typeText();}
  },{threshold:.5});
  io.observe(target);
}
function typeText(){
  const txt=window.__letter,el=$("typed");let i=0;
  if(reduced){el.textContent=txt;el.classList.add("done");$("sign").classList.add("on");return;}
  (function step(){
    el.textContent=txt.slice(0,++i);
    if(i<txt.length){
      const ch=txt[i-1];
      setTimeout(step,/[.!?]/.test(ch)?420:ch==="\n"?260:ch===","?160:rand(28,58));
    } else {el.classList.add("done");$("sign").classList.add("on");}
  })();
}

/* ---------- Ses (Web Audio, kullanıcı etkileşimiyle başlar) ---------- */
let ac=null,master=null,musicOn=false,musicTimer=null,step=0;
const CHORDS=[[87.31,130.81,220,261.63],[130.81,196,246.94,329.63],[98,146.83,196,293.66],[110,164.81,261.63,329.63]];
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5];
let lp=null;
function initAudio(){
  if(ac) return true;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return false;
  ac=new AC();master=ac.createGain();master.gain.value=.55;
  lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1400;lp.Q.value=.3;
  lp.connect(master);master.connect(ac.destination);
  const delay=ac.createDelay(2);delay.delayTime.value=.55;
  const fb=ac.createGain();fb.gain.value=.3;
  const wet=ac.createGain();wet.gain.value=.35;
  lp.connect(delay);delay.connect(fb);fb.connect(delay);delay.connect(wet);wet.connect(master);
  return true;
}
function voice(freq,vol,attack,dur,type){
  if(!ac||!lp) return;
  const t=ac.currentTime;
  [-3,3].forEach(det=>{
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type||"sine";o.frequency.value=freq;o.detune.value=det;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+attack);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(lp);o.start(t);o.stop(t+dur+.1);
  });
}
function tone(freq,vol,dur){voice(freq,vol,.02,dur,"sine");}
function musicStep(){
  if(!musicOn) return;
  if(step%4===0){
    const ch=CHORDS[(step/4)%CHORDS.length];
    ch.forEach(f=>voice(f,.022,1.6,6.5,"triangle"));
  }
  if(step%2===1||Math.random()<.35){
    const n=PENTA[Math.floor(Math.random()*PENTA.length)];
    voice(n,.03,.03,3.2,"sine");
  }
  step++;
}
function fanfare(){
  if(!musicOn||!ac) return;
  [0,2,3,5].forEach((n,i)=>setTimeout(()=>voice(PENTA[n],.035,.03,3,"sine"),i*260));
}
function chime(i){
  if(!musicOn||!ac) return;
  voice(PENTA[(i*2+1)%PENTA.length],.04,.03,2.8,"sine");
}
const ICON_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function setMusic(on){
  if(on&&!initAudio()) return;
  musicOn=on;
  const b=$("sound");
  b.innerHTML=on?ICON_ON:ICON_OFF;
  b.setAttribute("aria-pressed",on);
  b.setAttribute("aria-label",on?"Müziği kapat":"Müziği aç");
  clearInterval(musicTimer);
  if(on){ if(ac.state==="suspended") ac.resume(); musicTimer=setInterval(musicStep,1300); }
}
function startAudioIfWanted(fromStart){
  // Kutlamayla birlikte müzik başlar; ikonla kapatılabilir.
  if(fromStart&&!musicOn&&!userMuted) setMusic(true);
}
let userMuted=false;
$("sound").addEventListener("click",()=>{
  userMuted=musicOn; setMusic(!musicOn);
});
$("sound").innerHTML=ICON_OFF;
document.addEventListener("visibilitychange",()=>{
  if(!ac) return;
  if(document.hidden) ac.suspend(); else if(musicOn) ac.resume();
});

applyConfig();
})();
